<svg xmlns="http://www.w3.org/2000/svg" class="ds-diagram" viewBox="0 0 760 290" role="img" aria-label="Benchmark protocol: select the best checkpoint by rollouts, then evaluate it on three new seeds"><defs><linearGradient id="ds" x1="0" y1="0" x2="1" y2="0.2"><stop offset="0" stop-color="#1468b8"/><stop offset="0.6" stop-color="#289be4"/><stop offset="1" stop-color="#45b2ee"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7b7bd"/></marker></defs><rect x="0" y="10" width="140" height="124" rx="16" fill="#f5f5f7"/><text x="18" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="start">Train</text><text x="18" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">on the demos</text><line x1="140" y1="72" x2="154" y2="72" stroke="#b7b7bd" stroke-width="1.8" marker-end="url(#ah)"/><rect x="155" y="10" width="140" height="124" rx="16" fill="#f5f5f7"/><text x="173" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="start">Roll out</text><text x="173" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">50 episodes,</text><text x="173" y="102" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">every 50 epochs</text><line x1="295" y1="72" x2="309" y2="72" stroke="#b7b7bd" stroke-width="1.8" marker-end="url(#ah)"/><rect x="310" y="10" width="140" height="124" rx="16" fill="#f5f5f7"/><text x="328" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="start">Select</text><text x="328" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">the best</text><text x="328" y="102" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">checkpoint</text><line x1="450" y1="72" x2="464" y2="72" stroke="#b7b7bd" stroke-width="1.8" marker-end="url(#ah)"/><rect x="465" y="10" width="140" height="124" rx="16" fill="#ffffff" stroke="#289be4" stroke-width="1.5"/><text x="483" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1468b8" text-anchor="start">Evaluate</text><text x="483" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">3 new seeds</text><text x="483" y="102" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">× 50 episodes</text><line x1="605" y1="72" x2="619" y2="72" stroke="#b7b7bd" stroke-width="1.8" marker-end="url(#ah)"/><rect x="620" y="10" width="140" height="124" rx="16" fill="#f5f5f7"/><text x="638" y="48" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1d1d1f" text-anchor="start">Report</text><text x="638" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#6e6e73" text-anchor="start">mean ± std</text><text x="0" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6e6e73" text-anchor="start">Re-testing on new seeds keeps the number honest: the best of many</text><text x="0" y="212" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6e6e73" text-anchor="start">noisy in-training rollouts is optimistic, by about 7 points for ACT</text><text x="0" y="238" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6e6e73" text-anchor="start">on this benchmark.</text></svg>
