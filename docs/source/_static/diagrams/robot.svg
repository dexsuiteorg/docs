text-anchor="start">Mount</text><text x="284" y="78" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">adapter file</text><text x="284" y="120" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">one entry per</text><text x="284" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">end-effector</text><text x="284" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">pose on end_link</text><line x1="500" y1="110" x2="522" y2="110" stroke="#b7b7bd" stroke-width="1.8" marker-end="url(#ah)"/><rect x="524" y="10" width="236" height="200" rx="16" fill="#f5f5f7"/><text x="546" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#1d1d1f" text-anchor="start">End-effector</text><text x="546" y="78" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="400" fill="#6e6e73" text-anchor="start">gripper=&quot;allegro&quot;</text><text x="546" y="120" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">welded to the mount</text><text x="546" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">joint limits</text><text x="546" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#1d1d1f" text-anchor="start">tool poin